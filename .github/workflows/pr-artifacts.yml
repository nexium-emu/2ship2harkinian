name: pr-artifacts

on:
  workflow_run:
    workflows: [generate-builds]
    types: [completed]

permissions: {}

concurrency:
  group: pr-artifacts-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  pr-artifacts:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # This privileged job reads API metadata only. Never check out PR code or
      # download or execute an artifact here, including scripts inside archives.
      - name: Update pull request build links
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const matchesRun = pull =>
              pull.state === 'open' &&
              pull.base.repo.id === context.payload.repository.id &&
              pull.head.sha === run.head_sha &&
              pull.head.repo?.id === run.head_repository?.id;

            let pull;
            for (const candidate of run.pull_requests ?? []) {
              const { data } = await github.rest.pulls.get({
                owner, repo, pull_number: candidate.number,
              });
              if (matchesRun(data)) {
                pull = data;
                break;
              }
            }
            // Fork runs can omit pull_requests from the workflow_run payload.
            if (!pull) {
              for await (const { data } of github.paginate.iterator(
                github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }
              )) {
                pull = data.find(matchesRun);
                if (pull) break;
              }
            }
            if (!pull) {
              core.info('No open pull request matches this repository and head commit.');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 }
            );
            const packages = [
              ['2ship-windows', 'Windows'],
              ['2ship-linux', 'Linux'],
              ['2ship-mac', 'macOS'],
            ];
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
            const links = packages.flatMap(([name, label]) => {
              const artifact = artifacts.filter(item => item.name === name && !item.expired)
                .sort((a, b) => b.id - a.id)[0];
              return artifact ? [`- [${label}](${runUrl}/artifacts/${artifact.id})`] : [];
            });
            if (!links.length) {
              core.info('No downloadable build packages remain for this run.');
              return;
            }

            const marker = '<!-- 2ship-build-artifacts -->';
            const body = [
              marker,
              '### Test builds',
              '',
              `Built from ${run.head_sha.slice(0, 12)} in [run #${run.run_number}](${runUrl}).`,
              '',
              ...links,
              '',
              'Sign in to GitHub to download. These are temporary test builds, not releases.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull.number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            // Check again immediately before writing in case the PR advanced.
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: pull.number,
            });
            if (!matchesRun(current)) {
              core.info('The pull request changed while collecting artifacts; skipping.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull.number, body,
              });
            }
