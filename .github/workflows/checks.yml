name: repository-checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release tooling
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          grep " $archive\$" checksums.txt | sha256sum --check
          tar -xzf "$archive"
      - name: Validate GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
